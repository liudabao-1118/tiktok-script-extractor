name: frame-check-tmp
on:
  workflow_dispatch:
    inputs:
      url:
        description: "video url"
        required: true
permissions:
  contents: read
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - name: Install
        run: |
          python -m pip install -q --upgrade yt-dlp
          which ffmpeg ffprobe || (sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg)
      - name: Download video
        env:
          URL: ${{ inputs.url }}
        run: |
          set -e
          yt-dlp --no-warnings --no-playlist -f "best[ext=mp4]/best" -o video.mp4 "$URL" || {
            echo "yt-dlp failed, trying tikwm"
            curl -sS -m 40 "https://www.tikwm.com/api/?url=$URL" -o tikwm.json
            PLAY=$(python -c "import json;d=json.load(open('tikwm.json'));print(d['data']['play'])")
            curl -sSL -m 90 -A "Mozilla/5.0" "$PLAY" -o video.mp4
          }
          ls -lh video.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4
      - name: Build contact sheets
        run: |
          set -e
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video.mp4)
          echo "DURATION::$D"
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 video.mp4)
          HT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 video.mp4)
          echo "SIZE::${W}x${HT}"
          F16=$(python -c "print(18.0/$D)")
          F24=$(python -c "print(26.0/$D)")
          ffmpeg -hide_banner -loglevel error -i video.mp4 -vf "fps=$F16,scale=270:-1,tile=4x4" -frames:v 1 -q:v 5 sheet16.jpg -y
          ffmpeg -hide_banner -loglevel error -i video.mp4 -vf "fps=$F24,scale=220:-1,tile=6x4" -frames:v 1 -q:v 5 sheet24.jpg -y
          ls -lh sheet16.jpg sheet24.jpg
      - name: Emit frames
        run: |
          for f in sheet16.jpg sheet24.jpg; do
            echo "===BEGIN:$f==="
            base64 -w0 "$f" | fold -w 4000 | sed "s/^/B64::/"
            echo "===END:$f==="
          done
      - name: Metadata
        env:
          URL: ${{ inputs.url }}
        run: |
          yt-dlp --skip-download --no-warnings --print "META::%(id)s|%(uploader)s|%(duration)s|%(title)s|%(description)s" "$URL" || echo "META unavailable"
