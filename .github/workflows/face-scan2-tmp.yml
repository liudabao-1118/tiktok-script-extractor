name: face-scan2-tmp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          python -m pip install -q --upgrade yt-dlp opencv-python-headless numpy mediapipe
          which ffmpeg ffprobe || (sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg)
          curl -sSL -o blaze_face_short_range.tflite "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
          ls -lh blaze_face_short_range.tflite
          python -c "from mediapipe.tasks.python import vision; print('tasks api ok')"
      - name: Scan
        timeout-minutes: 120
        run: python facescan/scan2.py facescan/links.json ${{ matrix.part }} 6 results2.csv
      - name: Emit
        run: |
          echo "===BEGIN:RESULTS2==="
          cat results2.csv
          echo "===END:RESULTS2==="
