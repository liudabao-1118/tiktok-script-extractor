name: face-scan3-tmp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg
          python -m pip install -q --upgrade yt-dlp opencv-python-headless numpy
          curl -fSL -o face_detection_yunet_2023mar.onnx "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" || curl -fSL -o face_detection_yunet_2023mar.onnx "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
          ls -lh face_detection_yunet_2023mar.onnx
          test $(stat -c%s face_detection_yunet_2023mar.onnx) -gt 100000
          python -c "import cv2; cv2.FaceDetectorYN.create('face_detection_yunet_2023mar.onnx','',(320,320)); print('YUNET_OK', cv2.__version__)"
      - name: Scan
        timeout-minutes: 120
        run: python facescan/scan3.py facescan/links.json ${{ matrix.part }} 6 results3.csv
      - name: Emit
        run: |
          echo "===BEGIN:RESULTS3==="
          cat results3.csv
          echo "===END:RESULTS3==="
